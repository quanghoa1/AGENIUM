[workspace]
resolver = "2"
members = ["apps/cli", "foundation/*", "security/*", "agent/*", "orchestration/*", "quality/*", "devtools/xtask"]
# The desktop app is its own workspace (WebView dependencies stay out of the core build and CI).
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
agenium-core = { path = "foundation/core" }
agenium-config = { path = "foundation/config" }
agenium-store = { path = "foundation/store" }
agenium-bus = { path = "foundation/bus" }
agenium-secrets = { path = "security/secrets" }
agenium-vcs = { path = "foundation/vcs" }
agenium-sandbox = { path = "security/sandbox" }
agenium-llm = { path = "agent/llm" }
agenium-tools = { path = "agent/tools" }
agenium-backend = { path = "agent/loop" }
agenium-memory = { path = "agent/memory" }
agenium-orchestrator = { path = "orchestration/orchestrator" }
agenium-skills = { path = "agent/skills" }
agenium-mcp = { path = "agent/mcp" }
agenium-cli-backend = { path = "agent/cli-backend" }
agenium-documents = { path = "agent/documents" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
futures = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
ignore = "0.4"
regex = "1"
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions", "hooks"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "=0.1.9"
# ANN sidecar (ADR-50); C++17, builds with MSYS2 gcc on windows-gnu.
usearch = "=2.26.5"
crc32fast = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
toml = "0.9"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
zstd = "0.14.3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: each test and example binary carries all of them, and with it target/ held
# 140 GB of binaries (2026-10-31). Backtraces keep their line numbers in our own code.
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
