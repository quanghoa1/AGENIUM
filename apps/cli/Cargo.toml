[package]
name = "agenium-cli"
description = "Headless command line front-end of Agenium (the desktop UI comes later)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agenium"
path = "src/main.rs"

[dependencies]
agenium-cli-backend.workspace = true
agenium-config.workspace = true
agenium-core.workspace = true
agenium-llm.workspace = true
agenium-mcp.workspace = true
agenium-memory.workspace = true
agenium-orchestrator.workspace = true
agenium-sandbox.workspace = true
agenium-secrets.workspace = true
agenium-skills.workspace = true
agenium-store.workspace = true
agenium-vcs.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

