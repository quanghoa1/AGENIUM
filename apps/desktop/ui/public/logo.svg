<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="ca-left" x1="256" y1="72" x2="104" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="ca-right" x1="256" y1="140" x2="408" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ca-bar" x1="144" y1="296" x2="368" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Crisp Daylight Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ca-bg)" />
  <rect x="19" y="19" width="474" height="474" rx="113" stroke="#BFDBFE" stroke-width="6" />

  <!-- Soft Subtle Depth Shadow Behind Ribbons -->
  <g opacity="0.10" transform="translate(0, 10)">
    <path d="M 238 86 C 248 64 278 64 288 86 L 202 280 L 146 406 C 136 428 104 422 96 400 L 84 368 C 78 352 82 334 90 316 L 238 86 Z" fill="#0F172A" />
    <path d="M 284 162 L 420 368 C 430 384 422 412 400 416 L 362 416 C 344 416 330 404 322 388 L 236 234 L 284 162 Z" fill="#0F172A" />
    <path d="M 164 268 H 348 C 364 268 376 280 376 296 C 376 312 364 324 348 324 H 164 C 148 324 136 312 136 296 C 136 280 148 268 164 268 Z" fill="#0F172A" />
  </g>

  <!-- Left Sweeping Ribbon Blade -->
  <path
    d="M 238 86 C 248 64 278 64 288 86 L 202 280 L 146 406 C 136 428 104 422 96 400 L 84 368 C 78 352 82 334 90 316 L 238 86 Z"
    fill="url(#ca-left)"
  />

  <!-- Right Sweeping Ribbon Blade -->
  <path
    d="M 284 162 L 420 368 C 430 384 422 412 400 416 L 362 416 C 344 416 330 404 322 388 L 236 234 L 284 162 Z"
    fill="url(#ca-right)"
  />

  <!-- Interlocking Ticket Cross-Ribbon -->
  <path
    d="M 164 268 H 348 C 364 268 376 280 376 296 C 376 312 364 324 348 324 H 164 C 148 324 136 312 136 296 C 136 280 148 268 164 268 Z"
    fill="url(#ca-bar)"
