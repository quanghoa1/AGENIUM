<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="banner-glow" cx="220" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="b-rail-left" x1="256" y1="88" x2="124" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="b-rail-right" x1="256" y1="88" x2="388" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="b-ticket-grad" x1="128" y1="240" x2="384" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="b-lead-node" x1="216" y1="68" x2="296" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="text-grad" x1="400" y1="100" x2="960" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="360" rx="28" fill="url(#banner-bg)" />
  <rect width="1200" height="360" rx="28" fill="url(#banner-glow)" />
  <rect x="2" y="2" width="1196" height="356" rx="26" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Tech Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="90" x2="1200" y2="90" stroke-dasharray="6 6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="6 6" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="6 6" />
    <line x1="360" y1="0" x2="360" y2="360" stroke-dasharray="6 6" />
  </g>

  <!-- Scaled Logomark on Left (Centered at x=190, y=180) -->
  <g transform="translate(52, 42) scale(0.54)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#0B1120" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="5" />
    <path d="M 124 404 Q 256 446 388 404" stroke="url(#b-rail-right)" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" fill="none" />
    <path d="M 256 108 L 124 404" stroke="url(#b-rail-left)" stroke-width="36" stroke-linecap="round" />
    <path d="M 256 108 L 388 404" stroke="url(#b-rail-right)" stroke-width="36" stroke-linecap="round" />
    <path
      d="M 146 244 H 366 A 14 14 0 0 1 380 258 V 270 A 16 16 0 0 0 380 302 V 314 A 14 14 0 0 1 366 328 H 146 A 14 14 0 0 1 132 314 V 302 A 16 16 0 0 0 132 270 V 258 A 14 14 0 0 1 146 244 Z"
      fill="#0F172A"
      stroke="url(#b-ticket-grad)"
      stroke-width="6"
    />
    <line x1="204" y1="252" x2="204" y2="320" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 5" />
    <circle cx="170" cy="286" r="15" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="3.5" />
    <path d="M 163 286 L 168 291 L 178 281" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="222" y="266" width="64" height="12" rx="6" fill="#38BDF8" />
    <circle cx="302" cy="272" r="6" fill="#F59E0B" />
    <rect x="222" y="292" width="124" height="12" rx="6" fill="#94A3B8" />
    <circle cx="256" cy="108" r="42" fill="#0B1120" stroke="url(#b-lead-node)" stroke-width="7" />
    <polygon points="256,82 282,108 256,134 230,108" fill="url(#b-lead-node)" />
    <circle cx="256" cy="108" r="7" fill="#FFFFFF" />
    <circle cx="124" cy="404" r="30" fill="#0B1120" stroke="#3B82F6" stroke-width="7" />
    <circle cx="124" cy="404" r="13" fill="#60A5FA" />
    <circle cx="388" cy="404" r="30" fill="#0B1120" stroke="#06B6D4" stroke-width="7" />
    <circle cx="388" cy="404" r="13" fill="#22D3EE" />
    <rect x="242" y="411" width="28" height="28" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="4.5" />
    <circle cx="256" cy="425" r="5" fill="#34D399" />
  </g>

  <!-- Right Side Typography & Architecture Badges -->
  <!-- Top Eyebrow Pill -->
  <rect x="384" y="68" width="388" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="404" cy="83" r="5" fill="#10B981" />
  <text x="418" y="88" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.6">
    TICKET-DRIVEN MULTI-AGENT CONTROL PLANE
  </text>

  <!-- Main Wordmark: AGENIUM -->
  <text x="380" y="188" fill="url(#text-grad)" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="92" font-weight="900" letter-spacing="-2.5">
    AGENIUM
  </text>

  <!-- Tagline -->
  <text x="384" y="230" fill="#94A3B8" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">
    Orchestrate Solo &amp; Lead-Worker AI Agents via Typed Tickets &amp; Git Worktrees
  </text>

  <!-- Three Architectural Pillar Chips -->
  <!-- Chip 1: Lead -> Worker DAG -->
  <g transform="translate(384, 258)">
    <rect width="224" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#38BDF8" />
    <text x="36" y="24" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">
      LEAD ➔ WORKER AGENTS
    </text>
  </g>

  <!-- Chip 2: Jira-like Ticket Ledger -->
  <g transform="translate(622, 258)">
    <rect width="236" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
    <rect x="14" y="13" width="14" height="12" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
    <text x="38" y="24" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">
      TICKET STATE MACHINE
    </text>
  </g>

  <!-- Chip 3: Git Worktree Merge Queue -->
  <g transform="translate(872, 258)">
    <rect width="256" height="38" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10B981" />
    <text x="36" y="24" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">
      WORKTREE MERGE QUEUE
    </text>
  </g>
</svg>
