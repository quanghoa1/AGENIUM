<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- App Icon Squircle Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Subtle Ambient Radial Glow -->
    <radialGradient id="core-glow" cx="256" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Border Rim Gradient -->
    <linearGradient id="rim-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.85" />
    </linearGradient>

    <!-- Left Orchestration Rail Gradient (Lead -> Worker A) -->
    <linearGradient id="rail-left" x1="256" y1="88" x2="124" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Orchestration Rail Gradient (Lead -> Worker B) -->
    <linearGradient id="rail-right" x1="256" y1="88" x2="388" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Jira-Style Ticket Crossbar Gradient -->
    <linearGradient id="ticket-grad" x1="128" y1="240" x2="384" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Ticket Surface Dark Inner Fill -->
    <linearGradient id="ticket-inner" x1="140" y1="244" x2="372" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1325" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#131E36" stop-opacity="0.94" />
    </linearGradient>

    <!-- Lead Apex Node Gradient -->
    <linearGradient id="lead-node" x1="216" y1="68" x2="296" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#core-glow)" />
  <rect x="18" y="18" width="476" height="476" rx="106" stroke="url(#rim-grad)" stroke-width="4" />

  <!-- 2. Subtle Isometric Command Grid Lines -->
  <g stroke="#1E293B" stroke-width="1.5" opacity="0.55">
    <line x1="64" y1="168" x2="448" y2="168" stroke-dasharray="6 6" />
    <line x1="64" y1="286" x2="448" y2="286" stroke-dasharray="6 6" />
    <line x1="64" y1="404" x2="448" y2="404" stroke-dasharray="6 6" />
    <line x1="256" y1="48" x2="256" y2="464" stroke-dasharray="6 6" />
  </g>

  <!-- 3. Bottom Sequential Merge Queue Arc (Connecting Worker Worktrees) -->
  <path
    d="M 124 404 Q 256 446 388 404"
    stroke="#1E293B"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 124 404 Q 256 446 388 404"
    stroke="url(#rail-right)"
    stroke-width="4.5"
    stroke-dasharray="8 8"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <!-- 4. The "A" Multi-Agent Orchestration Rails (Lead Apex -> Worker Nodes) -->
  <!-- Pure Vector Soft Depth Shadows -->
  <path d="M 256 116 L 124 412" stroke="#020617" stroke-width="42" stroke-linecap="round" opacity="0.55" />
  <path d="M 256 116 L 388 412" stroke="#020617" stroke-width="42" stroke-linecap="round" opacity="0.55" />

  <!-- Left Leg of 'A' -->
  <path
    d="M 256 108 L 124 404"
    stroke="url(#rail-left)"
    stroke-width="36"
    stroke-linecap="round"
  />
  <!-- Right Leg of 'A' -->
  <path
    d="M 256 108 L 388 404"
    stroke="url(#rail-right)"
    stroke-width="36"
    stroke-linecap="round"
  />
  <!-- Inner Bright Signal Traces inside the Rails -->
  <path
    d="M 256 108 L 124 404"
    stroke="#E0F2FE"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.5"
  />
  <path
    d="M 256 108 L 388 404"
    stroke="#CFFAFE"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- 5. Center Crossbar of "A": The Notched Jira-Style Ticket Card -->
  <!-- Pure Vector Soft Depth Shadow for Ticket Card -->
  <path
    d="M 146 252
       H 366
       A 14 14 0 0 1 380 266
       V 278
       A 16 16 0 0 0 380 310
       V 322
       A 14 14 0 0 1 366 336
       H 146
       A 14 14 0 0 1 132 322
       V 310
       A 16 16 0 0 0 132 278
       V 266
       A 14 14 0 0 1 146 252 Z"
    fill="#020617"
    opacity="0.6"
  />

  <!-- Outer Ticket Silhouette with classic left & right semicircular ticket punch notches -->
  <path
    d="M 146 244
       H 366
       A 14 14 0 0 1 380 258
       V 270
       A 16 16 0 0 0 380 302
       V 314
       A 14 14 0 0 1 366 328
       H 146
       A 14 14 0 0 1 132 314
       V 302
       A 16 16 0 0 0 132 270
       V 258
       A 14 14 0 0 1 146 244 Z"
    fill="url(#ticket-inner)"
    stroke="url(#ticket-grad)"
    stroke-width="5.5"
  />

  <!-- Ticket Perforation Stub Divider (Left Stub vs Ticket Body) -->
  <line
    x1="204"
    y1="252"
    x2="204"
    y2="320"
    stroke="#38BDF8"
    stroke-width="2.5"
    stroke-dasharray="6 5"
    opacity="0.7"
  />

  <!-- Ticket Status Check / Active State Indicator (Left Stub) -->
  <circle cx="170" cy="286" r="15" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-width="3.2" />
  <path
    d="M 163 286 L 168 291 L 178 281"
    stroke="#34D399"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ticket ID & Spec Bars (Right Body of Ticket) -->
  <!-- Top Pill: Ticket Key (e.g., AGN-1) -->
  <rect x="222" y="266" width="66" height="12" rx="6" fill="#38BDF8" />
  <!-- Priority Badge Dot -->
  <circle cx="304" cy="272" r="6" fill="#F59E0B" />
  <!-- Bottom Bar: Task Payload / Worktree Branch -->
  <rect x="222" y="292" width="126" height="12" rx="6" fill="#94A3B8" fill-opacity="0.75" />

  <!-- 6. Multi-Agent Nodes (1 Lead Crown Node + 2 Worker Base Nodes) -->
  <!-- Top Apex: LEAD AGENT NODE (Hexagonal/Diamond Command Core) -->
  <circle cx="256" cy="115" r="45" fill="#020617" opacity="0.6" />
  <circle cx="256" cy="108" r="42" fill="#0B1120" stroke="url(#lead-node)" stroke-width="6.5" />
  <polygon
    points="256,82 282,108 256,134 230,108"
    fill="url(#lead-node)"
  />
  <circle cx="256" cy="108" r="7" fill="#FFFFFF" />

  <!-- Bottom Left: WORKER AGENT NODE 1 -->
  <circle cx="124" cy="410" r="33" fill="#020617" opacity="0.6" />
  <circle cx="124" cy="404" r="30" fill="#0B1120" stroke="#3B82F6" stroke-width="6.5" />
  <circle cx="124" cy="404" r="13" fill="#60A5FA" />
  <circle cx="124" cy="404" r="5" fill="#FFFFFF" />

  <!-- Bottom Right: WORKER AGENT NODE 2 -->
  <circle cx="388" cy="410" r="33" fill="#020617" opacity="0.6" />
  <circle cx="388" cy="404" r="30" fill="#0B1120" stroke="#06B6D4" stroke-width="6.5" />
  <circle cx="388" cy="404" r="13" fill="#22D3EE" />
  <circle cx="388" cy="404" r="5" fill="#FFFFFF" />

  <!-- Bottom Center: MERGE QUEUE GATEWAY NODE -->
  <rect x="242" y="411" width="28" height="28" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="4" />
  <circle cx="256" cy="425" r="5" fill="#34D399" />
</svg>
