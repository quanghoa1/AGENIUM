<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Agenium works</title>
  <desc>You talk to a Lead agent, approve its spec; the Lead plans tickets with acceptance criteria; workers on any model each work in their own git worktree inside a sandbox; reports are reviewed per criterion and merged through one queue; memory and reflection turn proven lessons into skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="learn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A78BFA"/>
    </marker>
    <style>
      .card { fill: #111A2C; stroke: #23314A; stroke-width: 1.5; }
      .card-hi { fill: #0F1F38; stroke: #2563EB; stroke-width: 1.5; }
      .h { fill: #F1F5F9; font-size: 16px; font-weight: 700; }
      .t { fill: #94A3B8; font-size: 12.5px; }
      .lane { fill: #38BDF8; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .lane-v { fill: #A78BFA; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .edge { stroke: #64748B; stroke-width: 1.8; fill: none; }
      .edge-blue { stroke: #38BDF8; stroke-width: 1.8; fill: none; }
      .edge-amber { stroke: #F59E0B; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
      .edge-violet { stroke: #A78BFA; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
      .label { fill: #CBD5E1; font-size: 12px; }
      .label-amber { fill: #FBBF24; font-size: 12px; }
      .label-violet { fill: #C4B5FD; font-size: 12px; }
      .chip { fill: #0B1324; stroke: #23314A; stroke-width: 1; }
      .chip-t { fill: #CBD5E1; font-size: 12px; }
      .mono { fill: #7DD3FC; font-size: 11.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .foot-h { fill: #E2E8F0; font-size: 13px; font-weight: 700; }
      .foot-t { fill: #94A3B8; font-size: 12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="860" rx="24" fill="url(#bg)"/>
  <rect x="48" y="40" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="48" y="80" fill="#F8FAFC" font-size="28" font-weight="800">How Agenium works</text>
  <text x="48" y="108" fill="#94A3B8" font-size="15">Tickets are the only channel for work: every step is a typed, validated call, recorded as an event.</text>

  <!-- 1 · PLAN -->
  <text x="48" y="150" class="lane">1 · PLAN</text>
  <rect x="48" y="162" width="168" height="92" rx="14" class="card-hi"/>
  <text x="66" y="192" class="h">You</text>
  <text x="66" y="214" class="t">describe the goal,</text>
  <text x="66" y="232" class="t">approve, answer</text>

  <rect x="268" y="162" width="200" height="92" rx="14" class="card"/>
  <text x="286" y="192" class="h">Lead agent</text>
  <text x="286" y="214" class="t">talks with you, plans,</text>
  <text x="286" y="232" class="t">assigns and reviews</text>

  <rect x="520" y="162" width="196" height="92" rx="14" class="card"/>
  <text x="538" y="192" class="h">Spec</text>
  <text x="538" y="214" class="t">numbered requirements,</text>
  <text x="538" y="232" class="t">approved by you</text>

  <rect x="768" y="162" width="220" height="92" rx="14" class="card"/>
  <text x="786" y="192" class="h">Plan &amp; tickets</text>
  <text x="786" y="214" class="t">acceptance criteria,</text>
  <text x="786" y="232" class="t">dependencies, one role each</text>

  <path d="M216 208 H262" class="edge" marker-end="url(#arrow)"/>
  <text x="222" y="200" class="label">chat</text>
  <path d="M468 208 H514" class="edge" marker-end="url(#arrow)"/>
  <path d="M716 208 H762" class="edge" marker-end="url(#arrow)"/>

  <!-- 2 · WORK -->
  <text x="48" y="306" class="lane">2 · WORK</text>
  <path d="M878 254 V290 H198 V316" class="edge" marker-end="url(#arrow)"/>
  <path d="M518 290 V316" class="edge" marker-end="url(#arrow)"/>
  <path d="M838 290 V316" class="edge" marker-end="url(#arrow)"/>
  <text x="890" y="280" class="label">assigned by role</text>

  <rect x="48" y="322" width="300" height="104" rx="14" class="card"/>
  <text x="66" y="352" class="h">Worker · backend</text>
  <rect x="66" y="364" width="96" height="22" rx="11" class="chip"/>
  <text x="78" y="379" class="chip-t">Codex CLI</text>
  <text x="66" y="410" class="mono">worktree AGN-12</text>

  <rect x="368" y="322" width="300" height="104" rx="14" class="card"/>
  <text x="386" y="352" class="h">Worker · frontend</text>
  <rect x="386" y="364" width="108" height="22" rx="11" class="chip"/>
  <text x="398" y="379" class="chip-t">Claude Code</text>
  <text x="386" y="410" class="mono">worktree AGN-13</text>

  <rect x="688" y="322" width="300" height="104" rx="14" class="card"/>
  <text x="706" y="352" class="h">Worker · tester</text>
  <rect x="706" y="364" width="118" height="22" rx="11" class="chip"/>
  <text x="718" y="379" class="chip-t">DeepSeek API</text>
  <text x="706" y="410" class="mono">worktree AGN-14</text>

  <rect x="48" y="440" width="940" height="38" rx="10" class="chip"/>
  <text x="66" y="464" class="chip-t">Each ticket: its own git worktree, an OS sandbox · files · shell · MCP tools (found by search; destructive ones ask you) · skills</text>

  <!-- questions back to you -->
  <path d="M60 322 C 20 300, 20 270, 52 254" class="edge-amber" marker-end="url(#arrow-amber)"/>
  <text x="66" y="278" class="label-amber">questions · permission requests</text>

  <!-- 3 · REVIEW & MERGE -->
  <text x="48" y="506" class="lane">3 · REVIEW &amp; MERGE</text>
  <path d="M232 478 V536" class="edge" marker-end="url(#arrow)"/>

  <rect x="48" y="542" width="210" height="92" rx="14" class="card"/>
  <text x="66" y="572" class="h">Report</text>
  <text x="66" y="594" class="t">one result per criterion,</text>
  <text x="66" y="612" class="t">with evidence</text>

  <rect x="310" y="542" width="220" height="92" rx="14" class="card"/>
  <text x="328" y="572" class="h">Review</text>
  <text x="328" y="594" class="t">the Lead checks each</text>
  <text x="328" y="612" class="t">criterion against evidence</text>

  <rect x="582" y="542" width="196" height="92" rx="14" class="card"/>
  <text x="600" y="572" class="h">Merge queue</text>
  <text x="600" y="594" class="t">project checks,</text>
  <text x="600" y="612" class="t">one merge at a time</text>

  <rect x="830" y="542" width="158" height="92" rx="14" class="card-hi"/>
  <text x="848" y="572" class="h">main</text>
  <text x="848" y="594" class="t">ticket closed;</text>
  <text x="848" y="612" class="t">dependents start</text>

  <path d="M258 588 H304" class="edge" marker-end="url(#arrow)"/>
  <path d="M530 588 H576" class="edge" marker-end="url(#arrow)"/>
  <path d="M778 588 H824" class="edge" marker-end="url(#arrow)"/>
  <text x="536" y="580" class="label">approved</text>

  <path d="M420 542 V500 H518 V484" class="edge-amber" marker-end="url(#arrow-amber)"/>
  <text x="428" y="516" class="label-amber">reopened with feedback per criterion</text>

  <!-- LEARN -->
  <rect x="1028" y="134" width="204" height="500" rx="18" fill="url(#learn)" stroke="#4C1D95" stroke-width="1.5"/>
  <text x="1048" y="164" class="lane-v">LEARN</text>

  <rect x="1046" y="178" width="168" height="120" rx="12" class="card"/>
  <text x="1062" y="204" class="h">Memory</text>
  <text x="1062" y="226" class="t">facts, lessons and a</text>
  <text x="1062" y="244" class="t">knowledge graph, found</text>
  <text x="1062" y="262" class="t">locally; recalled into</text>
  <text x="1062" y="280" class="t">every work order</text>

  <rect x="1046" y="330" width="168" height="120" rx="12" class="card"/>
  <text x="1062" y="356" class="h">Reflection</text>
  <text x="1062" y="378" class="t">a lesson proven across</text>
  <text x="1062" y="396" class="t">tickets is weighed once:</text>
  <text x="1062" y="414" class="t">improve a skill, make</text>
  <text x="1062" y="432" class="t">one, or keep a memory</text>

  <rect x="1046" y="482" width="168" height="134" rx="12" class="card"/>
  <text x="1062" y="508" class="h">Skills</text>
  <text x="1062" y="530" class="t">SKILL.md per role and</text>
  <text x="1062" y="548" class="t">agent; an agent writes</text>
  <text x="1062" y="566" class="t">its own copy through</text>
  <text x="1062" y="584" class="t">strict gates, never the</text>
  <text x="1062" y="602" class="t">system's files</text>

  <path d="M1130 298 V324" class="edge-violet" marker-end="url(#arrow-violet)"/>
  <path d="M1130 450 V476" class="edge-violet" marker-end="url(#arrow-violet)"/>
  <!-- what was learned flows into memory; memory and skills flow into the next work order -->
  <path d="M988 588 C 1010 588, 1012 250, 1040 246" class="edge-violet" marker-end="url(#arrow-violet)"/>
  <text x="934" y="650" class="label-violet">every ticket teaches its agent</text>
  <path d="M1046 214 C 1010 214, 1004 372, 994 372" class="edge-violet" marker-end="url(#arrow-violet)"/>

  <!-- foundation -->
  <line x1="48" y1="688" x2="1232" y2="688" stroke="#23314A" stroke-width="1"/>
  <rect x="48" y="708" width="286" height="112" rx="14" class="card"/>
  <text x="66" y="736" class="foot-h">Any model, mixed in one team</text>
  <text x="66" y="758" class="foot-t">Anthropic · OpenAI · Gemini · DeepSeek</text>
  <text x="66" y="776" class="foot-t">OpenRouter · Azure · Bedrock · local</text>
  <text x="66" y="794" class="foot-t">Claude Code · Codex · Grok · OpenCode</text>

  <rect x="348" y="708" width="286" height="112" rx="14" class="card"/>
  <text x="366" y="736" class="foot-h">One event log</text>
  <text x="366" y="758" class="foot-t">board, audit trail and live view</text>
  <text x="366" y="776" class="foot-t">always agree; a crash loses nothing;</text>
  <text x="366" y="794" class="foot-t">tokens and cost per run and ticket</text>

  <rect x="648" y="708" width="286" height="112" rx="14" class="card"/>
  <text x="666" y="736" class="foot-h">Safe by default</text>
  <text x="666" y="758" class="foot-t">OS sandbox per command; secrets in an</text>
  <text x="666" y="776" class="foot-t">encrypted vault, never in prompts,</text>
  <text x="666" y="794" class="foot-t">logs or git; untrusted content fenced</text>

  <rect x="948" y="708" width="284" height="112" rx="14" class="card"/>
  <text x="966" y="736" class="foot-h">Desktop app and CLI</text>
  <text x="966" y="758" class="foot-t">Windows and Linux; chat, board, diffs,</text>
  <text x="966" y="776" class="foot-t">live office, memory; optional judge</text>
  <text x="966" y="794" class="foot-t">(Jev) for small decisions, fail-open</text>
</svg>
