[package]
name = "agenium-mcp"
description = "MCP client hub: stdio and Streamable HTTP servers per agent, credential binding, MCP tools as agent tools."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agenium-config.workspace = true
agenium-sandbox.workspace = true
agenium-tools.workspace = true
async-trait.workspace = true
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
