[package]
name = "agenium-tools"
description = "Agent work tools (decision 16): file read/list/glob/grep/write/edit/multi_edit/apply_patch, shell, fetch, todo, view_image, browser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agenium-documents.workspace = true
agenium-sandbox.workspace = true
async-trait.workspace = true
futures.workspace = true
base64 = "0.22"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
agenium-core.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
