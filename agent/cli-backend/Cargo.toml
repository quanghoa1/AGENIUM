[package]
name = "agenium-cli-backend"
description = "CliBackend (M2.5): vendor agent CLIs driven headless (JSON stream) in an Agenium-owned per-run home."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agenium-backend.workspace = true
agenium-core.workspace = true
agenium-llm.workspace = true
agenium-mcp.workspace = true
agenium-sandbox.workspace = true
agenium-tools.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
tracing.workspace = true
futures.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
ulid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
